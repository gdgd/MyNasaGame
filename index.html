<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survival on the Moon</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.controls {
    text-align: center;
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}

.item {
    position: relative;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    transition: transform 0.2s;
}

.item:hover {
    transform: scale(1.03);
}

.item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.item-name {
    padding: 10px;
    text-align: center;
    font-weight: bold;
}

.rank {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: crimson;
    color: white;
    font-size: 20px;
    font-weight: bold;
    display: none;
    justify-content: center;
    align-items: center;
}

.selected .rank {
    display: flex;
}
</style>
</head>

<body>

<h1>Survival on the Moon</h1>

<div class="controls">
    <button onclick="undo()">1つ戻す</button>
    <button onclick="resetRanking()">リセット</button>
</div>

<div class="grid" id="itemsContainer"></div>

<script>

const items = [
    { name: "酸素ボンベ", image: "images/oxygen.png" },
    { name: "水", image: "images/water.png" },
    { name: "星図", image: "images/star-map.png" },
    { name: "食料", image: "images/food.png" },
    { name: "救急箱", image: "images/first-aid.png" },

    { name: "通信機", image: "images/radio.png" },
    { name: "パラシュート", image: "images/parachute.png" },
    { name: "ライフラフト", image: "images/life-raft.png" },
    { name: "拳銃", image: "images/pistol.png" },
    { name: "マッチ", image: "images/matches.png" },

    { name: "ロープ", image: "images/rope.png" },
    { name: "ミルク", image: "images/milk.png" },
    { name: "携帯暖房器", image: "images/heater.png" },
    { name: "コンパス", image: "images/compass.png" },
    { name: "信号弾", image: "images/signal-flare.png" }
];

let order = [];

const container = document.getElementById("itemsContainer");

function render() {
    container.innerHTML = "";

    items.forEach((item, index) => {

        const rank = order.indexOf(index);

        const div = document.createElement("div");
        div.className = "item";

        if (rank !== -1) {
            div.classList.add("selected");
        }

        div.innerHTML = `
            <div class="rank">${rank + 1}</div>
            <img src="${item.image}" alt="${item.name}">
        `;

        div.onclick = () => toggleItem(index);

        container.appendChild(div);
    });
}

function toggleItem(index) {

    const existing = order.indexOf(index);

    if (existing !== -1) {
        order.splice(existing, 1);
    } else {
        order.push(index);
    }

    render();
}

function undo() {

    if (order.length > 0) {
        order.pop();
    }

    render();
}

function resetRanking() {

    order = [];
    render();
}

render();

</script>

</body>
</html>
