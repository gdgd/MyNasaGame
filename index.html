<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Survival on the Moon</title>

<style>

body{
    background:#f4f4f4;
    font-family:sans-serif;
    margin:20px;
}

h1{
    text-align:center;
}

.controls{
    text-align:center;
    margin-bottom:20px;
}

button{
    padding:10px 20px;
    margin:5px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
    cursor:pointer;
    overflow:hidden;
    position:relative;
}

.card canvas{
    display:block;
    margin:auto;
}

.name{
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.rank{
    position:absolute;
    top:8px;
    right:8px;

    width:36px;
    height:36px;

    border-radius:50%;
    background:#d62828;
    color:white;

    display:none;
    justify-content:center;
    align-items:center;

    font-weight:bold;
}

.selected .rank{
    display:flex;
}

</style>
</head>
<body>

<h1>🌕 Survival on the Moon</h1>

<div class="controls">
    <button onclick="undo()">1つ戻す</button>
    <button onclick="resetRanking()">リセット</button>
</div>

<div id="container" class="grid"></div>

<script>

const items = [
"酸素ボンベ",
"水",
"星図",
"食料",
"救急箱",
"通信機",
"パラシュート",
"ライフラフト",
"拳銃",
"マッチ",
"ロープ",
"ミルク",
"携帯暖房器",
"コンパス",
"信号弾"
];

let order=[];

const container=document.getElementById("container");

function pixel(ctx,x,y,w,h,color){
    ctx.fillStyle=color;
    ctx.fillRect(x*4,y*4,w*4,h*4);
}

function drawIcon(canvas,index){

    const ctx=canvas.getContext("2d");

    ctx.imageSmoothingEnabled=false;

    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,128,128);

    switch(index){

        case 0: // 酸素
            pixel(ctx,10,4,12,20,"#3b9d4a");
            pixel(ctx,11,10,10,14,"#dddddd");
            pixel(ctx,14,1,4,3,"#444");
            break;

        case 1: // 水
            pixel(ctx,13,3,6,20,"#4ea8de");
            break;

        case 2: // 星図
            pixel(ctx,6,6,20,16,"#1d3557");
            pixel(ctx,12,12,1,1,"white");
            pixel(ctx,20,8,1,1,"white");
            pixel(ctx,18,18,1,1,"white");
            break;

        case 3: // 食料
            pixel(ctx,8,10,16,8,"#b08968");
            pixel(ctx,8,18,16,4,"#7f5539");
            break;

        case 4: // 救急箱
            pixel(ctx,8,8,16,16,"#eeeeee");
            pixel(ctx,14,10,4,12,"red");
            pixel(ctx,10,14,12,4,"red");
            break;

        case 5: // 通信機
            pixel(ctx,8,8,16,14,"#444");
            pixel(ctx,12,12,8,4,"#00ff88");
            break;

        case 6: // パラシュート
            pixel(ctx,8,6,16,8,"#ff595e");
            pixel(ctx,15,14,2,8,"#222");
            break;

        case 7: // ライフラフト
            pixel(ctx,8,8,16,12,"#f77f00");
            pixel(ctx,12,12,8,4,"#111");
            break;

        case 8: // 拳銃
            pixel(ctx,6,12,20,4,"#444");
            pixel(ctx,14,16,4,8,"#6f4e37");
            break;

        case 9: // マッチ
            pixel(ctx,10,8,2,14,"#d4a373");
            pixel(ctx,18,8,2,14,"#d4a373");
            pixel(ctx,10,6,2,2,"red");
            pixel(ctx,18,6,2,2,"red");
            break;

        case 10: // ロープ
            ctx.strokeStyle="#8d6e63";
            ctx.lineWidth=6;
            ctx.beginPath();
            ctx.arc(64,64,25,0,Math.PI*2);
            ctx.stroke();
            break;

        case 11: // ミルク
            pixel(ctx,12,4,8,20,"#ffffff");
            pixel(ctx,12,4,8,4,"#4ea8de");
            break;

        case 12: // 暖房器
            pixel(ctx,8,8,16,16,"#444");
            pixel(ctx,12,12,8,8,"orange");
            break;

        case 13: // コンパス
            ctx.beginPath();
            ctx.arc(64,64,35,0,Math.PI*2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(64,64);
            ctx.lineTo(80,45);
            ctx.strokeStyle="red";
            ctx.stroke();
            break;

        case 14: // 信号弾
            pixel(ctx,12,6,8,18,"#e63946");
            pixel(ctx,14,2,4,4,"yellow");
            break;
    }
}

function render(){

    container.innerHTML="";

    items.forEach((name,index)=>{

        const rank=order.indexOf(index);

        const card=document.createElement("div");
        card.className="card";

        if(rank!==-1){
            card.classList.add("selected");
        }

        card.innerHTML=`
            <div class="rank">${rank+1}</div>
            <canvas width="128" height="128"></canvas>
            <div class="name">${name}</div>
        `;

        card.onclick=()=>toggle(index);

        container.appendChild(card);

        drawIcon(
            card.querySelector("canvas"),
            index
        );
    });
}

function toggle(index){

    const pos=order.indexOf(index);

    if(pos>=0){
        order.splice(pos,1);
    }else{
        order.push(index);
    }

    render();
}

function undo(){

    if(order.length){
        order.pop();
    }

    render();
}

function resetRanking(){

    order=[];
    render();
}

render();

</script>

</body>
</html>
