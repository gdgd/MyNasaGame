<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="images/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survival on the Moon</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.controls {
    text-align: center;
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

.grid {
    display: grid;
    gap: 15px;
}

/* 通常モード */
.grid.normal-mode {
    grid-template-columns: 1fr;
}

/** 一覧モード 
.grid.compact-mode {
    grid-template-columns:
        repeat(auto-fill, minmax(90px, 1fr));
}
*/

.grid.compact-mode {
    grid-template-columns:
        repeat(4, 1fr);
}


.item {
    position: relative;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    overflow: hidden;
}

/* 通常モード画像 */
.item img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}

/* 一覧モード画像 */
.compact-mode .item img {
    width: 100%;
    height: 80px;
    object-fit: contain;
}

.compact-mode .item-name {

    display: none;
}

.compact-mode .reason {

    display: none;
}



.detail-layout {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px;
}

.detail-layout textarea {
    flex: 1;
    min-height: 80px;
}


.detail-layout img {

    width: 80px;
    height: 80px;

    object-fit: contain;
}


.item-name {
    padding: 10px;
    text-align: center;
    font-weight: bold;
}

.rank {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: crimson;
    color: white;
    font-size: 20px;
    font-weight: bold;
    display: none;
    justify-content: center;
    align-items: center;
}
.ranking-panel {
    position: sticky;
    top: 0;
    z-index: 100;
    background: white;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    max-height: 120px;
    overflow-y: auto;
}

.reason {
    width: calc(100% - 20px);
    margin: 10px;
    min-height: 70px;
    resize: vertical;
    box-sizing: border-box;
    font-size: 14px;
}

.selected .rank {
    display: flex;
}

.info-container {
    max-width: 1000px;
    margin: 0 auto 20px auto;
}

details {
    background: white;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

summary {
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

details p,
details li {
    line-height: 1.8;
}

@media (max-width: 768px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>Survival on the Moon</h1>
<h2>Nasaゲーム（グループ回答用）</h2>


<div class="controls">
	<div id="rankingPanel" class="ranking-panel"></div>
    <button onclick="undo()">1つ戻す</button>
    <button onclick="resetRanking()">リセット</button>    
    <button onclick="toggleViewMode()">一覧</button>
</div>
<div class="grid" id="itemsContainer"></div>

<script>

const items = [
    { name: "酸素ボンベ", image: "images/oxygen.png" },
    { name: "水", image: "images/water.png" },
    { name: "星図", image: "images/star-map.png" },
    { name: "食料", image: "images/food.png" },
    { name: "救急箱", image: "images/first-aid.png" },

    { name: "通信機", image: "images/radio.png" },
    { name: "パラシュート", image: "images/parachute.png" },
    { name: "救命ボート", image: "images/life-raft.png" },
    { name: "拳銃", image: "images/pistol.png" },
    { name: "マッチ", image: "images/matches.png" },

    { name: "ロープ", image: "images/rope.png" },
    { name: "粉ミルク", image: "images/milk.png" },
    { name: "携帯暖房器", image: "images/heater.png" },
    { name: "コンパス", image: "images/compass.png" },
    { name: "信号弾", image: "images/signal-flare.png" }
];

const reasons =
    JSON.parse(
        localStorage.getItem("answerReasons")
    ) || {};

let order =
    JSON.parse(
        localStorage.getItem("answerOrder")
    ) || [];
    
const container = document.getElementById("itemsContainer");

function render() {

if(answerCompactMode){
    container.className = "grid compact-mode";
}else{
    container.className = "grid normal-mode";
}
    container.innerHTML = "";

    items.forEach((item, index) => {

        const rank = order.indexOf(index);

        const div = document.createElement("div");
        div.className = "item";

        if (rank !== -1) {
            div.classList.add("selected");
        }
        
if(answerCompactMode){
    div.innerHTML = `
        <div class="rank">
            ${rank !== -1 ? rank + 1 : ""}
        </div>
        <img src="${item.image}" alt="${item.name}">
    `;
}else{

    div.innerHTML = `
        <div class="rank">
            ${rank !== -1 ? rank + 1 : ""}
        </div>

        <div class="detail-layout">

            <img src="${item.image}" alt="${item.name}">

            <textarea
                class="reason"
                data-index="${index}"
                placeholder="理由を入力"
            >${reasons[index] || ""}</textarea>

        </div>

        <div class="item-name">
            ${index + 1}. ${item.name}
        </div>
    `;
}
        div.onclick = () => toggleItem(index);

        container.appendChild(div);
    });
    
    document.querySelectorAll(".reason").forEach(textarea => {
    
        textarea.addEventListener("click", (e) => {
            e.stopPropagation();
        });
        
        textarea.addEventListener("mousedown", e => {
            e.stopPropagation();
        }); 
   
        textarea.addEventListener("input", (e) => {
    
            const index = e.target.dataset.index;
    
            reasons[index] = e.target.value;
    
            localStorage.setItem(
                "answerReasons",
                JSON.stringify(reasons)
            );
    
        });
    
    });
    updateRankingPanel();
}

function toggleItem(index) {

    const existing = order.indexOf(index);

    if (existing !== -1) {
        order.splice(existing, 1);
    } else {
        order.push(index);
    }

localStorage.setItem(
    "answerOrder",
    JSON.stringify(order)
);
    render();
    
}

function undo() {

    if (order.length > 0) {
        order.pop();
    }

    
localStorage.setItem(
    "answerOrder",
    JSON.stringify(order)
);    
    render();
}

function resetRanking() {

    if (!confirm("順位と理由をすべて削除しますか？")) {
        return;
    }

    order = [];

    Object.keys(reasons).forEach(key => {
        delete reasons[key];
    });

    localStorage.removeItem("answerOrder");
    localStorage.removeItem("answerReasons");

    render();
}


let answerCompactMode =
    JSON.parse(
        localStorage.getItem("answerCompactMode")
    ) || false;

function toggleViewMode() {

    answerCompactMode = !answerCompactMode;

    localStorage.setItem(
        "answerCompactMode",
        JSON.stringify(answerCompactMode)
    );

    render();
}

function updateRankingPanel() {

    const panel =
        document.getElementById("rankingPanel");

    panel.innerHTML =
        `<b>現在の選択 ${order.length}/15</b>`;
}

render();

</script>

</body>
</html>
